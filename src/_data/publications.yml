- slug: social-sciences-hard
  title: "Why are the Social Sciences Hard? Two New Hypotheses"
  authors: ["Aydin Mohseni", "Daniel A. Herrmann", "Gabe Avakian Orona"]
  year: 2026
  status: published
  venue: "Studies in History and Philosophy of Science"
  volume: "119"
  issue: ""
  pages: "102197"
  article_number: "102197"
  doi: "10.1016/j.shpsa.2026.102197"
  links:
    pdf: "/wp-content/uploads/2024/06/Herrmann-Mohseni-Orona-2024-Why-are-the-Human-Sciences-Hard.pdf"
    journal: "https://doi.org/10.1016/j.shpsa.2026.102197"
  strand: metascience
  selected: true
  summary: "Proposes two reasons the social sciences are hard: researchers are committed to a fixed set of prediction targets and cannot switch to more tractable ones, and human baseline performance on easy behavioral predictions is already high. Offers a formal framework for judging how hard a discipline is and how much its achievements mean."
  exproof: ""
  verified: crossref
  verify_note: "Crossref prints the title in sentence case ('Why are the social sciences hard? Two new hypotheses'); title case here follows the CV. The pre-print PDF on the old site carries the earlier title 'Why are the Human Sciences Hard?' and the old author order Herrmann, Mohseni, Orona."

