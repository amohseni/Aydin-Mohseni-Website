# Research strands for the home page. Strand names and topic lists from the CV research summary.
# Essays are built only from sourced descriptions; each paragraph lists its sources (`sources`),
# repeated with detail in docs/CONTENT-AUDIT.md. Model ids per docs/BRIEF.md.
# Paragraphs are plain text; the template links paper titles to /research/#pub-<slug>
# using the `links` map (title string -> slug), and co-inquirers' names (coinquirers.yml
# `display`) to their sites. A paragraph with `verify` (a note) is marked data-verify, with the
# same note the Research page gives the work it draws on.

- slug: ai-safety
  title: "AI safety"
  topics: "AI agent foundations, value learning and alignment, automated research"
  model: hypotheses
  caption: "A learner's hypotheses about a coin's chance of heads, as cells as tall as their probabilities, with a catch-all for the values it has not named. Each flip moves probability by Bayes' rule within the current partition; when the catch-all grows probable enough, it splits into newly named hypotheses and total probability stays 1."
  essay:
    - text: "Aydin's work on agency focuses especially on artificial intelligence: the foundations of AI safety, agency, and alignment. With Daniel Herrmann he directs ∃xProof AI, an AI safety research group that uses decision and game theory, mechanistic interpretability, and philosophical analysis to understand advanced AI systems as agents."
      sources: ["old home page bio", "exproof.ai index.html", "exproof.ai people.html", "CV research summary"]
    - text: "Standard decision theory lets an agent learn about the world while its values stay fixed. In Learning the Value of Value Learning, Alex J. London and Aydin extend the Jeffrey–Bolker framework so that values themselves can be refined, and prove a value-of-information theorem for this refinement. Between agents, mutual refinement tends to turn zero-sum games into positive-sum ones."
      sources: ["arXiv:2511.17714 abstract", "exproof.ai value-uncertainty.html"]
    - text: "With Daniel Herrmann, Benjamin A. Levinstein and Bruce Rushing, he shows that causal reasoning in structural causal models reduces to subjective probability once interventions are treated as events in the world. With L. G. Demo, he treats alignment as a principal-agent problem, with formal models of delegation, incentives and misalignment between a principal and a more capable agent."
      sources: ["exproof.ai publications.html (Bayesian Reduction of Causation summary)", "exproof.ai delegation.html"]
  links:
    "Learning the Value of Value Learning": value-of-value-learning
  selected: [value-of-value-learning, bayesian-causation, principal-agent, ai-commons]
  exproof:
    - title: "Decision under Value Uncertainty"
      url: "https://exproof.ai/value-uncertainty.html"
    - title: "Naturalizing Agency"
      url: "https://exproof.ai/naturalizing-agency.html"
    - title: "AI Alignment and Delegation"
      url: "https://exproof.ai/delegation.html"

- slug: metascience
  title: "Metascience"
  topics: "Grant funding, replication crisis, social epistemology of science"
  model: community
  caption: "Twelve agents try two actions, one slightly better, and share their results with the agents they are linked to (the network model of Bala and Goyal 1998 and Zollman 2007). Each node's shade is its credence that the better action is better. Green: the community settles on the better action. Red: it locks in on the worse one."
  essay:
    - text: "His metascience work asks how scientific communities produce knowledge. He studies grant funding, the replication crisis, and the social epistemology of science, using Bayesian inference, game theory, network theory, and agent-based models."
      sources: ["old home page bio", "CV research summary"]
    - text: "Several papers model how information moves through a community. In Truth and Conformity on Networks, written with Cole Williams, agents learn from private evidence and from what their neighbors say, while trading accuracy against conformity; networks that sustain a diversity of opinion support honest communication and reliable true belief. The Best Paper You'll Read Today, with Cailin O'Connor and James Owen Weatherall, shows how standard practices in science journalism can distort public belief and drive polarization."
      sources: ["old Research page summaries of Truth and Conformity on Networks and The Best Paper You'll Read Today"]
    - text: "Other work asks what reforms do. HARKing: from Misunderstanding to Misprescription argues that the effect of hypothesizing after the results are known depends on the prior probabilities of the hypotheses chosen before and after the data, and that misdiagnosing it leads to poor reforms. A Bayesian model of grant funding, in which output depends on talent and resources and funding compounds talent over time, compares allocation strategies from peer review to uniform seed funding."
      sources: ["PhilSci-Archive 18523 abstract", "old Research page (HARKing)", "old Computational Models page (Optimal Grant Funding for Scientific Production)"]
      verify: "Two inferences, as on the Research page: the HARKing title follows the CV ('from Misunderstanding to Misprescription'), while the old site, PhilSci-Archive and Aydin's August 2026 Research page say 'From Misdiagnosis to Misprescription'; and the grant-funding model is attached to 'A Bayesian Model of Optimal Grant Funding' (CV W6) rather than W7 by inference."
  links:
    "Truth and Conformity on Networks": truth-and-conformity
    "The Best Paper You'll Read Today": best-paper
    "HARKing: from Misunderstanding to Misprescription": harking
  selected: [social-sciences-hard, best-paper, truth-and-conformity, harking, bayesian-grant-funding]

- slug: methods
  title: "Methods"
  subtitle: "Formal epistemology and game theory"
  topics: "Bayesian epistemology, decision theory, evolutionary game theory"
  model: reflection
  caption: "Possible futures of an agent's credence that a coin is biased toward heads, simulated from its own present probabilities. For a Bayesian agent their average (red) stays level, as van Fraassen's Reflection principle requires. The toggle shows an agent who expects to change its mind."
  essay:
    - text: "Stochastic Stability and Disagreements between Dynamics asks why the replicator dynamics and the Moran process can make different predictions, and traces the divergence to standard analytic techniques and to the idealizations each model makes. Limitations of Equilibrium Concepts in Evolutionary Games gives an explicit definition of evolutionary significance and shows that proposed equilibrium refinements make errors of omission or commission."
      sources: ["old Research page summaries of both papers"]
    - text: "With Simon Huttegger, he reconciles Kalai and Lehrer's result on Bayesian learning of Nash equilibrium with Foster and Young's impossibility theorem. With Cailin O'Connor and Hannah Rubin, he tested whether a difference in group size alone produces disadvantage for a minority: in a repeated Nash demand game, members of the minority group made low demands more often and earned lower payoffs."
      sources: ["old Research page ('Are Nash Equilibria Rational?', taken to be CV W2 'The Rationality of Nash Equilibria')", "old Research page (Red King)"]
      verify: "The first sentence uses the old site's abstract of 'Are Nash Equilibria Rational?' (Mohseni and Huttegger), assumed to be CV W2 'The Rationality of Nash Equilibria'."
  links:
    "Stochastic Stability and Disagreements between Dynamics": stochastic-stability
    "Limitations of Equilibrium Concepts in Evolutionary Games": equilibrium-concepts
  selected: [stochastic-stability, equilibrium-concepts, red-king, rationality-nash]
