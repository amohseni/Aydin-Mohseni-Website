name: "Aydin Mohseni"
tagline: "Mathematical philosopher"
url: "https://aydinmohseni.com"

short_bio: >-
  Aydin Mohseni is a mathematical philosopher and assistant professor in the Department of
  Philosophy at Carnegie Mellon University. He uses evolutionary game theory and Bayesian
  epistemology to study problems in AI safety and metascience.

long_bio:
  - >-
    Aydin Mohseni is a mathematical philosopher and assistant professor in the Department of
    Philosophy at Carnegie Mellon University. He uses evolutionary game theory and Bayesian
    epistemology to study problems in AI safety and metascience: how agents
    represent the world, value outcomes, and act, and how scientific communities produce
    knowledge. His work on agency focuses especially on artificial intelligence,
    including the foundations of AI safety, agency, and alignment. He uses Bayesian
    inference, decision and game theory, network theory, and agent-based modeling to study
    problems ranging from scientific funding and reform to causal reasoning and value
    learning in artificial agents. He is a member of CMU's Institute for Complex Social
    Dynamics (ICSD) and the Center for Conceptual Research on Safe AI (CoRe Safe AI).
  - >-
    Previously, he was a senior research fellow at the University of Pennsylvania and a
    postdoctoral research fellow at the Center for Philosophy of Science at the University
    of Pittsburgh. He completed his doctorate in the Department of Logic and Philosophy of
    Science at the University of California, Irvine, supervised by Dr. Simon Huttegger and
    Dr. Cailin O'Connor.
  - >-
    Some years ago, he was a Peace Corps volunteer in Morocco, stationed near أزرو.
  - >-
    His Erdős number is 3. (By way of Brian Skyrms to Persi Diaconis to Paul Erdős.)

